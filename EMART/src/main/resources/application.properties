server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/emart}
spring.data.mongodb.auto-index-creation=true

# Admin credentials (NOT stored in DB, NOT hardcoded in Java).
# In production set ADMIN_EMAIL / ADMIN_PASSWORD environment variables instead of editing this file.
emart.admin.email=${ADMIN_EMAIL:admin@emart.com}
emart.admin.password=${ADMIN_PASSWORD:23112007}

# JWT (secret must be >= 32 characters; override with JWT_SECRET in production)
jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_use_a_long_random_string_32chars_min}
jwt.expiration=86400000

# CORS (comma-separated list allowed)
emart.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.jackson.default-property-inclusion=non_null
